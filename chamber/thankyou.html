<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Thank you for applying to join the Salt Lake City Chamber of Commerce."
    />
    <meta name="author" content="Karolina Lym" />
    <title>Thank You | Salt Lake City Chamber</title>

    <link rel="stylesheet" href="../styles/normalize.css" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="styles/small.css" />
    <link rel="stylesheet" href="styles/larger.css" />
    <link rel="stylesheet" href="styles/join.css" />

    <script defer src="scripts/join.js"></script>
  </head>
  <body>
    <header>
      <div class="header-top">
        <h1>Salt Lake City Chamber</h1>
        <button id="menu-button" aria-label="Open navigation menu">
          &#9776;
        </button>
      </div>

      <nav id="site-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="directory.html">Directory</a></li>
          <li><a href="join.html">Join</a></li>
          <li><a href="discover.html">Discover</a></li>
        </ul>
      </nav>
    </header>

    <main class="thankyou-main">
      <section class="thankyou-card">
        <h2>Thank You for Applying</h2>
        <p>
          We appreciate your interest in joining the Salt Lake City Chamber.
        </p>

        <div class="submitted-info">
          <p><strong>First Name:</strong> <span id="firstName"></span></p>
          <p><strong>Last Name:</strong> <span id="lastName"></span></p>
          <p><strong>Email:</strong> <span id="email"></span></p>
          <p><strong>Mobile Phone:</strong> <span id="phone"></span></p>
          <p>
            <strong>Business / Organization Name:</strong>
            <span id="organization"></span>
          </p>
          <p><strong>Submitted:</strong> <span id="timestampDisplay"></span></p>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; <span id="currentyear"></span> Salt Lake City Chamber</p>
      <p id="lastModified"></p>
    </footer>

    <script>
      const params = new URLSearchParams(window.location.search);

      document.querySelector("#firstName").textContent =
        params.get("firstName") || "";
      document.querySelector("#lastName").textContent =
        params.get("lastName") || "";
      document.querySelector("#email").textContent = params.get("email") || "";
      document.querySelector("#phone").textContent = params.get("phone") || "";
      document.querySelector("#organization").textContent =
        params.get("organization") || "";
      document.querySelector("#timestampDisplay").textContent =
        params.get("timestamp") || "";
    </script>
  </body>
</html>
