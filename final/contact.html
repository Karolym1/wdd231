<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | BSCPhotoPro</title>
    <meta name="description" content="Contact BSCPhotoPro for services." />

    <link rel="stylesheet" href="styles/base.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="site-header">
      <div class="logo">
        <img
          src="images/logo.png"
          alt="BSCPhotoPro Logo"
          width="50"
          height="50"
        />
        <div>
          <h1>BSCPhotoPro</h1>
          <p>Content and Marketing Support</p>
        </div>
      </div>

      <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="attributions.html">Attributions</a>
      </nav>
    </header>

    <main>
      <section class="card">
        <h2>Contact BSCPhotoPro</h2>
        <p>Fill out the form below to get started.</p>
      </section>

      <section class="card">
        <form method="get" action="thankyou.html">
          <label
            >Full Name
            <input type="text" name="fullname" required />
          </label>

          <label
            >Business Name
            <input type="text" name="business" />
          </label>

          <label
            >Email Address
            <input type="email" name="email" required />
          </label>

          <label
            >Phone Number
            <input type="tel" name="phone" />
          </label>

          <label
            >Service Interest
            <select name="service">
              <option>Content Creation</option>
              <option>Strategy</option>
              <option>Branding</option>
            </select>
          </label>

          <label
            >Project Details
            <textarea name="details"></textarea>
          </label>

          <button type="submit">Submit Inquiry</button>
        </form>
      </section>
    </main>

    <footer>
      <p>© 2026 BSCPhotoPro</p>
    </footer>
  </body>
</html>
